<!doctype html>
<html lang="en" data-language="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Not found · Awesome Office AI Copilots</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell" style="padding:8rem 0 6rem">
    <div class="panel" style="max-width:560px;margin:0 auto;text-align:center">
      <div class="panel-kicker">404</div>
      <h1 style="font-family:var(--display);font-weight:400;font-size:42px;letter-spacing:-.03em;margin:8px 0 12px">
        <span class="en">That page is not in the directory.</span>
        <span class="zh-only">该页面不在目录中。</span>
      </h1>
      <p style="color:var(--muted);margin:0 0 22px">
        <span class="en">The link may be outdated, or the page never existed.</span>
        <span class="zh-only">链接可能已失效，或页面不存在。</span>
      </p>
      <a class="button primary" href="./" style="background:var(--ink);color:#fff">
        <span class="en">Return to guide →</span>
        <span class="zh-only">返回指南 →</span>
      </a>
    </div>
  </main>
  <script>
    try {
      const lang = localStorage.getItem("aoac-lang")
        || ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en");
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.documentElement.dataset.language = lang === "zh" ? "zh" : "en";
      document.title = lang === "zh"
        ? "页面未找到 · 全球 Office AI Copilot 精选目录"
        : "Not found · Awesome Office AI Copilots";
    } catch (_) {}
  </script>
</body>
</html>
